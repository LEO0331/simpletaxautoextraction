name: Flutter CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify synthetic data against real Firestore rules
        shell: bash
        run: |
          mkdir -p build/emulator
          curl -fsSL --retry 3 https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.19.8.jar -o build/emulator/firestore.jar
          echo '9d43599ed6151199e8d604dc87fac51218e49e5f3a48519b1ae560bbe5e3382d  build/emulator/firestore.jar' | sha256sum -c -
          java -Duser.language=en -Duser.country=US -jar build/emulator/firestore.jar --host 127.0.0.1 --port 8186 --project_id demo-phase1 --rules firestore.rules > build/emulator/server.log 2>&1 &
          task_emulator_pid=$!
          trap 'kill "$task_emulator_pid"' EXIT
          python3 scripts/test_firestore_rules.py
          python3 scripts/test_capacity_rules.py

  browser-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Matching Chrome and WebDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
      - run: flutter pub get
      - name: Real browser against local Auth and Firestore emulators
        shell: bash
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm install --prefix build/release-tools --no-save firebase-tools@14.11.2
          "${{ steps.chrome.outputs.chromedriver-path }}" --port=4444 > build/chromedriver.log 2>&1 &
          task_driver_pid=$!
          trap 'kill "$task_driver_pid"' EXIT
          build/release-tools/node_modules/.bin/firebase emulators:exec --project demo-phase1 --config firebase.release.json --only auth,firestore 'make e2e-web'
      - name: Browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-diagnostics
          path: |
            build/chromedriver.log
            firestore-debug.log
            firebase-debug.log
          retention-days: 7
